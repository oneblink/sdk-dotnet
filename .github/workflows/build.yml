name: Tests

on:
  push:
    branches-ignore:
      - "master"
      - "dependabot/**"
    tags-ignore:
      - "**"

jobs:
  build:
    env:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET SDK 8.0.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "8.0.x"
      - name: Setup .NET SDK 9.0.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "9.0.x"
      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"
      - uses: microsoft/DevSkim-Action@v1
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      # The tests are integration tests against shared OneBlink resources, so each
      # target framework runs on its own. Running them together lets one
      # framework's create/delete calls interfere with another's.
      - name: Test
        run: |
          status=0
          for framework in net8.0 net9.0 net10.0; do
            dotnet test --no-restore --framework "$framework" --verbosity normal --configuration Release --logger GitHubActions || status=1
          done
          exit $status
